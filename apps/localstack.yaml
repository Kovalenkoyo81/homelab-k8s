---
apiVersion: v1
kind: Namespace
metadata:
  name: localstack
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3.8.0
          ports:
            - containerPort: 4566
          volumeMounts:
            - name: data
              mountPath: /var/lib/localstack
          env:
            - name: PERSISTENCE
              value: "1"
      volumes:
        - name: data
          hostPath:
            path: /opt/localstack
            type: DirectoryOrCreate
      nodeSelector:
        kubernetes.io/hostname: vps1
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: localstack
spec:
  selector:
    app: localstack
  ports:
    - port: 4566
      targetPort: 4566
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: localstack
  namespace: localstack
spec:
  rules:
    - host: localstack.10.8.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: localstack
                port:
                  number: 4566
